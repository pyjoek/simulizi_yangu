version: '3'
services: 
  backend: 
    build: ./backend
    ports:
    - '5000:5000'
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postpass
      - DN_NAME=storiesdb
    restart: always

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: storiesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postpass
    volumes: 
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: