version: '3'
services: 
  backend: 
    build: ./backend
    ports:
    - '5000:5000'
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=rapha
      - DB_PASSWORD=rapha123
      - DB_NAME=storiesdb
    restart: always

  frontend:
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    restart: always

  db:
    image: mysql:8.0
    restart: always
    ports:
       - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: storiesdb
      MYSQL_USER: rapha
      MYSQL_PASSWORD: rapha123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: